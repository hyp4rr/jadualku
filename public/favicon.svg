<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f5b83d"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    
    <!-- Top header bar / calendar binder -->
    <rect x="76" y="80" width="360" height="56" rx="20" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Grid blocks (Timetable Schedule layout) -->
    <!-- Column 1 -->
    <rect x="76" y="160" width="168" height="136" rx="28" fill="#ffffff" />
    <rect x="76" y="320" width="168" height="112" rx="28" fill="#93c5fd" />
    
    <!-- Column 2 -->
    <rect x="268" y="160" width="168" height="88" rx="28" fill="url(#accent)" />
    <rect x="268" y="272" width="168" height="160" rx="28" fill="#ffffff" />
  </svg>